<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R1 NOC Wall</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%234c9aff'/><path d='M3 11l3-4 3 2 4-5' stroke='white' stroke-width='1.6' fill='none'/></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <h1 id="title">R1 NOC Wall</h1>
  <div class="ctl" id="ctl"><button id="prev" title="Previous screen (←)">◀</button><button id="hold" title="Hold / resume rotation (space)">❚❚ Hold</button><button id="next" title="Next screen (→)">▶</button></div>
  <span class="screen-name"></span><div class="dots"></div><select id="viewSel" class="ctl-sel" title="Switch view" style="display:none"></select>
  <span class="chip" id="drill" title="Click to clear the venue filter" style="display:none;cursor:pointer;color:var(--info)"></span>
  <div class="spacer"></div>
  <span class="chip" id="src">connecting…</span>
  <a class="chip" id="edit" href="/admin" style="display:none;color:var(--muted);text-decoration:none">Edit</a>
  <span class="clock" id="clock"></span>
</header>
<div id="banner"></div>
<main id="stage"></main>
<footer id="ticker"><div class="track"></div></footer>
<div id="takeover" hidden>
  <div class="tk-card">
    <div class="tk-head"><span class="tk-icon">⚠</span><span class="tk-title">ALERT</span><span class="tk-count"></span></div>
    <div class="tk-list"></div>
    <div class="tk-actions"><button data-ack="30">Acknowledge 30 min</button><button data-ack="240">Acknowledge 4 h</button></div>
  </div>
</div>
<script src="/layout.js"></script>
<script src="/app.js"></script>
</body>
</html>
